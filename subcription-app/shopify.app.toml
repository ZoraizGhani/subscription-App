# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4df4707f56ec6035d9395e58a3d4b8ce"
name = "Subscription App"
application_url = "https://subscription-app-gules.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_contracts/create"
  topics = [ "subscription_contracts/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_contracts/update"
  topics = [ "subscription_contracts/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/failure"
  topics = [ "subscription_billing_attempts/failure" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/success"
  topics = [ "subscription_billing_attempts/success" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_orders,read_publications,write_customer_payment_methods,write_customers,write_orders,write_own_subscription_contracts,write_products,write_publications"

[events]
# This app has no real use for Shopify's Events subscription feature (it's
# unrelated to the [webhooks] above) -- this section exists only because
# deploy validation started requiring it for this app's config. Subscribed to
# a low-frequency, harmless topic; app/routes/events.app.placeholder.tsx
# discards the payload.
api_version = "unstable"

  [[events.subscription]]
  handle = "placeholder_product_update_events"
  topic = "Product"
  actions = [ "update" ]
  uri = "/events/app/placeholder"

[auth]
redirect_urls = [ "https://subscription-app-gules.vercel.app/api/auth" ]
